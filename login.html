<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Secure Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Decorative Animated Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: moveBlob 15s infinite alternate ease-in-out;
            opacity: 0.6;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            top: -10%;
            left: -10%;
            background: rgba(46, 204, 113, 0.4);
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            bottom: -20%;
            right: -10%;
            background: rgba(52, 152, 219, 0.4);
            animation-delay: -5s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 50%;
            background: rgba(155, 89, 182, 0.3);
            animation-delay: -10s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { transform: translateY(0); opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #a8ff78, #78ffd6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            font-weight: 300;
        }

        /* Dynamic Input Group */
        .input-group {
            margin-bottom: 30px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 2px;
            font-family: monospace;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: normal;
            font-family: 'Outfit', sans-serif;
        }

        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(76, 175, 80, 0.6);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
            transform: scale(1.02);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.5);
            transition: fill 0.3s ease;
        }

        .input-wrapper input:focus + .input-icon {
            fill: #4CAF50;
        }

        /* Gradient Submit Button */
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Shine Effect */
        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.6s ease;
        }

        .login-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(56, 239, 125, 0.4);
        }

        .login-btn:hover::after {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(2px) scale(0.98);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .login-btn:hover .btn-icon {
            transform: translateX(5px);
        }

        /* Status Messages */
        .message-box {
            margin-top: 25px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            backdrop-filter: blur(10px);
        }

        .message-box.error {
            display: block;
            background: rgba(255, 75, 75, 0.15);
            border: 1px solid rgba(255, 75, 75, 0.3);
            color: #ff8e8e;
            opacity: 1;
            transform: translateY(0);
        }

        .message-box.success {
            display: block;
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #8eff93;
            opacity: 1;
            transform: translateY(0);
        }

        /* Keyframe for shaking input */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

    </style>
</head>
<body>

    <!-- Animated Ambient Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-card" id="loginCard">
        <div class="header">
            <h1>Secure Gateway</h1>
            <p>Authentication via dynamic passkey sequence.</p>
        </div>

        <div class="input-group">
            <label for="passkey">System Passkey</label>
            <div class="input-wrapper">
                <input type="password" id="passkey" placeholder="Format: DDYYYYMM" maxlength="8" onkeypress="handleEnter(event)" autocomplete="off">
                <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm3 10c-1.103 0-2-.897-2-2s.897-2 2-2 2 .897 2 2-.897 2-2 2z"/>
                </svg>
            </div>
        </div>

        <button class="login-btn" onclick="verifyLogin()">
            Verify Connection
            <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="m11.293 17.293 1.414 1.414L19.414 12l-6.707-6.707-1.414 1.414L15.586 11H6v2h9.586z"/>
            </svg>
        </button>

        <div id="status-message" class="message-box"></div>
    </div>

    <!-- Logic Script -->
    <script>
        function getDynamicPasskey() {
            // Generates DayYearMonth (e.g. 19202603)
            const d = new Date();
            const dd = String(d.getDate()).padStart(2, '0');
            const yyyy = String(d.getFullYear());
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            return dd + yyyy + mm; 
        }

        // Make input focused on load naturally
        window.onload = () => {
            document.getElementById('passkey').focus();
            const storedAdminKey = localStorage.getItem("admin_passkey") || "00000000";
            const expected = storedAdminKey === "00000000" ? getDynamicPasskey() : storedAdminKey;
            console.log("Developer Hint: Current valid passkey is", expected);
        }

        function handleEnter(e) {
            if(e.key === 'Enter') {
                verifyLogin();
            }
        }

        function verifyLogin() {
            const input = document.getElementById('passkey');
            const messageBox = document.getElementById('status-message');
            const card = document.getElementById('loginCard');
            
            // Sync with Admin logic Custom Passkey in LocalStorage
            const storedAdminKey = localStorage.getItem("admin_passkey") || "00000000";
            const expectedKey = storedAdminKey === "00000000" ? getDynamicPasskey() : storedAdminKey;

            // Reset visual states
            messageBox.className = 'message-box';
            card.style.animation = 'none';
            
            if(!input.value) {
                messageBox.innerHTML = "Access Denied: Passkey is required.";
                messageBox.classList.add('error');
                
                // Trigger shake animation using tiny timeout
                setTimeout(() => { card.style.animation = 'shake 0.4s ease-in-out'; }, 10);
                input.focus();
                return;
            }

            if(input.value === expectedKey) {
                // SUCCESS
                messageBox.innerHTML = "Authentication Confirmed. Loading dashboard...";
                messageBox.classList.add('success');
                
                // Beautiful success confirmation animation
                card.style.transform = 'scale(1.03)';
                card.style.boxShadow = '0 0 60px rgba(76, 175, 80, 0.4)';
                card.style.border = '1px solid rgba(76, 175, 80, 0.8)';
                card.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                input.disabled = true;
                const btn = document.querySelector('.login-btn');
                btn.disabled = true;
                btn.innerHTML = "Connecting...";

                // Redirect simulation to registration form page
                setTimeout(() => {
                    window.location.href = "registration_form.html";
                }, 1500);

            } else {
                // FAILURE
                messageBox.innerHTML = "Invalid Passkey Signature!";
                messageBox.classList.add('error');
                
                // Trigger shake
                setTimeout(() => { card.style.animation = 'shake 0.4s ease-in-out'; }, 10);
                
                input.value = "";
                input.focus();
            }
        }
    </script>
</body>
</html>
